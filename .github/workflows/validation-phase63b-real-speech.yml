name: validation-phase63b-real-speech

on:
  workflow_dispatch:
  push:
    branches: ["validation/phase6"]
    paths:
      - "validation/phase63b_fetch_development_refs.py"
      - "validation/phase63b_make_cases.py"
      - "validation/phase63b_report.py"
      - ".github/workflows/validation-phase63b-real-speech.yml"

permissions:
  contents: read
  actions: read

env:
  CANDIDATE_SOURCE: "9c59fec790e0490c22b363474dd75b476f891f8f"
  QUALIFICATION_ARTIFACT_ID: "10980470659"
  QUALIFICATION_ZIP_SHA256: "407b04a1130b559ef59d54c63f3d40c02d24fb08c106ef80dc7fdf8f654d645c"
  BUNDLE_SHA256: "9188ac73c104d53cb96b78e51a1e4a8bc1db9b02bcb660548faac945a5637e35"

jobs:
  real_speech:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.CANDIDATE_SOURCE }}
          path: candidate-src
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pinned diagnostic runtime
        run: |
          python -m pip install --disable-pip-version-check             numpy==2.1.3 soundfile==0.13.1 remotezip==0.12.3 onnxruntime==1.23.1
          mkdir -p validation/phase6/phase63b
          python -m pip freeze | sort > validation/phase6/phase63b/environment.txt
      - name: Build exact candidate frontend
        run: |
          test "$(git -C candidate-src rev-parse HEAD)" = "${CANDIDATE_SOURCE}"
          cmake -S candidate-src -B candidate-src/build -DCMAKE_BUILD_TYPE=Release
          cmake --build candidate-src/build --parallel 2
          ctest --test-dir candidate-src/build --output-on-failure
      - name: Select fixed English and Mandarin development references without labels
        run: |
          python validation/phase63b_fetch_development_refs.py             --tcd-url "https://huggingface.co/datasets/urgent-challenge/urgent26_track2_sqa/resolve/main/TCD-VOIP.zip"             --tmhint-url "https://huggingface.co/datasets/urgent-challenge/urgent26_track2_sqa/resolve/main/TMHINTQI.zip"             --outdir validation/phase6/phase63b/references             --out validation/phase6/phase63b/references.csv
      - name: Generate fixed real-speech transformation matrix
        run: |
          python validation/phase63b_make_cases.py             validation/phase6/phase63b/references.csv             validation/phase6/phase63b/audio             validation/phase6/phase63b/manifest.csv
      - name: Extract exact candidate features and Trace V2
        run: |
          PYTHONPATH=candidate-src/validation python candidate-src/validation/phase6_extract_features.py             validation/phase6/phase63b/manifest.csv validation/phase6/phase63b/features.csv             --dataset phase63b_real_speech --target-field placeholder_mos --target-scale mos1to5             --group-field canonical_source_id --system-field condition_id             --cli candidate-src/build/openvq_cli --jobs 4
          PYTHONPATH=candidate-src/validation python candidate-src/validation/phase6_export_sequences.py             validation/phase6/phase63b/manifest.csv validation/phase6/phase63b/features.csv             validation/phase6/phase63b/cache             --trace-cli candidate-src/build/openvq_trace_cli --jobs 4
      - name: Download and verify frozen three-model bundle
        run: |
          mkdir -p validation/phase6/phase63b/candidate
          curl --fail --location             -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"             -o validation/phase6/phase63b/qualification.zip             "https://api.github.com/repos/abdullah-x-bd/openvq/actions/artifacts/${QUALIFICATION_ARTIFACT_ID}/zip"
          echo "${QUALIFICATION_ZIP_SHA256}  validation/phase6/phase63b/qualification.zip" | sha256sum -c -
          unzip -q validation/phase6/phase63b/qualification.zip -d validation/phase6/phase63b/candidate
          echo "${BUNDLE_SHA256}  validation/phase6/phase63b/candidate/bundle.json" | sha256sum -c -
      - name: Score the fixed real-speech matrix
        run: |
          python validation/phase63_score_bundle.py             validation/phase6/phase63b/cache/sequences.csv             --bundle validation/phase6/phase63b/candidate/bundle.json             --candidate-dir validation/phase6/phase63b/candidate             --expected-bundle-sha256 "${BUNDLE_SHA256}"             --out validation/phase6/phase63b/scored.csv
          python validation/phase63b_report.py             validation/phase6/phase63b/scored.csv validation/phase6/phase63b/features.csv             --out validation/phase6/phase63b/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openvq-phase63b-real-speech
          path: |
            validation/phase6/phase63b/references.csv
            validation/phase6/phase63b/references/reference-provenance.json
            validation/phase6/phase63b/audio/case-provenance.json
            validation/phase6/phase63b/manifest.csv
            validation/phase6/phase63b/features.csv
            validation/phase6/phase63b/scored.csv
            validation/phase6/phase63b/report.json
            validation/phase6/phase63b/cache/trace-provenance.json
            validation/phase6/phase63b/environment.txt
      - name: Enforce pre-reserve real-speech engineering screen
        run: |
          python - <<'PY'
          import json
          r=json.load(open("validation/phase6/phase63b/report.json"))
          if not r["passes_pre_reserve_engineering_screen"]:
              raise SystemExit("Phase 6.3B found blocking real-speech engineering failures")
          print("Phase 6.3B pre-reserve screen passed")
          PY
