name: validation-phase4-development
on:
  workflow_dispatch:

jobs:
  phase4-development:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsndfile1-dev
          python -m pip install --disable-pip-version-check numpy scipy soundfile huggingface_hub
      - name: Build OpenVQ
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Download frozen Phase-3 development artifact
        uses: actions/download-artifact@v4
        with:
          name: openvq-phase3-hybrid
          path: validation/phase4/phase3
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 36089410545
      - name: Download completed OpenACE artifact
        uses: actions/download-artifact@v4
        with:
          name: openvq-openace-polqa
          path: validation/phase4/openace-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 36099432761
      - name: Fit provisional Phase 4 without OpenACE labels
        run: |
          python validation/phase4_fit.py \
            --nisqa validation/phase4/phase3/nisqa-hybrid.csv \
            --tcd validation/phase4/phase3/tcd-test-hybrid.csv \
            --out validation/phase4/phase4-provisional.json
      - name: Fetch pinned OpenACE audio
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id="mcernak/EARS-EMO-OpenACE",
              repo_type="dataset",
              revision="31acd607eb4fb1d136677fab2aa6ced0af0e1194",
              local_dir="validation/openace/data",
          )
          PY
      - name: Extract OpenACE native feature table
        run: |
          python validation/openace_phase4_features.py \
            validation/phase4/openace-artifact/manifest-visqol.csv \
            validation/phase4/openace-features.csv \
            --cli ./build/openvq_cli --jobs 4
      - name: Apply provisional Phase 4
        run: |
          python validation/phase4_apply.py \
            validation/phase4/openace-features.csv \
            validation/phase4/phase4-provisional.json \
            validation/phase4/openace-phase4.csv
      - name: Report OpenACE development diagnostic
        run: |
          python validation/phase4_report.py \
            validation/phase4/openace-phase4.csv \
            --out validation/phase4/openace-phase4-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openvq-phase4-development
          path: |
            validation/phase4/phase4-provisional.json
            validation/phase4/openace-features.csv
            validation/phase4/openace-phase4.csv
            validation/phase4/openace-phase4-report.json
