name: validation-phase5-train

on:
  push:
    branches:
      - "validation/phase5-cross-domain"
    paths:
      - "validation/native_features.py"
      - "validation/tmhint_prepare.py"
      - "validation/phase5_train.py"
      - "docs/PHASE5_CROSS_DOMAIN.md"
      - ".github/workflows/validation-phase5-train.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy scipy remotezip huggingface_hub

      - name: Build OpenVQ
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

      - name: Reuse prior development feature artifacts
        run: |
          mkdir -p validation/phase5/dev validation/phase5/openace
          gh run download 36125312140 \
            --repo abdullah-x-bd/openvq \
            --name openvq-phase4-training \
            --dir validation/phase5/dev
          gh run download 36122422788 \
            --repo abdullah-x-bd/openvq \
            --name openvq-phase4-forensic \
            --dir validation/phase5/openace
          test -f validation/phase5/dev/tcd-train-features.csv
          test -f validation/phase5/dev/tcd-dev-features.csv
          test -f validation/phase5/dev/tcd-test-features.csv
          test -f validation/phase5/dev/nisqa-features.csv
          test -f validation/phase5/openace/openace-features.csv

      - name: Extract NISQA TEST_FOR development audio
        run: |
          python - <<'PY'
          from remotezip import RemoteZip
          from pathlib import Path
          url="https://zenodo.org/records/4728081/files/NISQA_Corpus.zip?download=1"
          out=Path("validation/phase5/test-for-data")
          out.mkdir(parents=True,exist_ok=True)
          with RemoteZip(url) as z:
              names=[n for n in z.namelist()
                     if "NISQA_TEST_FOR/" in n and not n.endswith("/")]
              print("TEST_FOR entries",len(names),flush=True)
              if not names:
                  raise SystemExit("TEST_FOR missing")
              for n in names:
                  z.extract(n,path=out)
          PY
          python validation/nisqa_holdout_prepare.py \
            validation/phase5/test-for-data \
            validation/phase5/test-for-manifest.csv \
            --family NISQA_TEST_FOR --expected 240

      - name: Extract TEST_FOR native features
        run: |
          python validation/native_features.py \
            validation/phase5/test-for-manifest.csv \
            validation/phase5/test-for-features.csv \
            --cli ./build/openvq_cli --jobs 4

      - name: Download and prepare TMHINT-QI v2 development data
        run: |
          mkdir -p validation/phase5/tmhint
          hf download --repo-type dataset urgent-challenge/urgent26_track2_sqa \
            TMHINTQI.zip --local-dir validation/phase5/tmhint
          unzip -q validation/phase5/tmhint/TMHINTQI.zip \
            -d validation/phase5/tmhint/extracted
          python validation/tmhint_prepare.py \
            validation/phase5/tmhint/extracted \
            validation/phase5/tmhint-manifest.csv

      - name: Extract TMHINT native features
        run: |
          python validation/native_features.py \
            validation/phase5/tmhint-manifest.csv \
            validation/phase5/tmhint-features.csv \
            --cli ./build/openvq_cli --jobs 4

      - name: Generate engineering constraints
        run: |
          python validation/engineering_matrix.py \
            --cli ./build/openvq_cli --fuzz 0 \
            --out validation/phase5/engineering-native.json

      - name: Train and cross-validate Phase 5
        run: |
          python validation/phase5_train.py \
            --tcd-train validation/phase5/dev/tcd-train-features.csv \
            --tcd-dev validation/phase5/dev/tcd-dev-features.csv \
            --tcd-test validation/phase5/dev/tcd-test-features.csv \
            --p501 validation/phase5/dev/nisqa-features.csv \
            --openace validation/phase5/openace/openace-features.csv \
            --test-for validation/phase5/test-for-features.csv \
            --tmhint validation/phase5/tmhint-features.csv \
            --engineering validation/phase5/engineering-native.json \
            --out validation/phase5/phase5-model.json \
            --cpp-out validation/phase5/phase5_model.inc

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openvq-phase5-training
          path: |
            validation/phase5/phase5-model.json
            validation/phase5/phase5_model.inc
            validation/phase5/test-for-features.csv
            validation/phase5/tmhint-features.csv
            validation/phase5/engineering-native.json
