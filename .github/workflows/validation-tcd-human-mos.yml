name: validation-tcd-human-mos
on:
  pull_request:
    paths:
      - "validation/tcd_*.py"
      - "python/calibrate*.py"
      - "python/build_training_table.py"
      - "src/**"
      - "include/**"
      - ".github/workflows/validation-tcd-human-mos.yml"
  workflow_dispatch:

jobs:
  tcd:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dataset tools
        run: python -m pip install --disable-pip-version-check huggingface_hub openpyxl
      - name: Build OpenVQ
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
      - name: Download TCD-VoIP
        run: |
          mkdir -p validation/tcd
          hf download --repo-type dataset urgent-challenge/urgent26_track2_sqa TCD-VOIP.zip \
            --local-dir validation/tcd
          unzip -q validation/tcd/TCD-VOIP.zip -d validation/tcd/extracted
      - name: Prepare TCD condition metadata
        run: |
          python validation/tcd_prepare.py validation/tcd/extracted validation/tcd/manifests
      - name: Zero-shot benchmark
        run: |
          python validation/tcd_score.py \
            validation/tcd/manifests/all.csv validation/tcd/zero-shot.csv
          python validation/tcd_report.py validation/tcd/zero-shot.csv \
            --out validation/tcd/zero-shot-report.json
      - name: Extract v0.2 feature table once
        run: |
          python python/build_training_table.py \
            validation/tcd/manifests/all.csv validation/tcd/all-features.csv
      - name: Condition-group five-fold cross-validation
        env:
          PYTHONPATH: python
        run: |
          python validation/tcd_group_cv.py validation/tcd/all-features.csv \
            --folds 5 --out validation/tcd/group-cv-report.json
      - name: Fit transferable TCD development calibration
        run: |
          python python/calibrate_joint.py validation/tcd/all-features.csv \
            --out validation/tcd/openvq-tcd-v02.calibration
      - name: In-sample diagnostic only
        run: |
          python validation/tcd_score.py \
            validation/tcd/manifests/all.csv validation/tcd/all-calibrated.csv \
            --calibration validation/tcd/openvq-tcd-v02.calibration
          python validation/tcd_report.py validation/tcd/all-calibrated.csv \
            --out validation/tcd/in-sample-report.json
      - name: Upload TCD validation
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openvq-tcd-validation-v02
          path: |
            validation/tcd/manifests/*.json
            validation/tcd/manifests/*.csv
            validation/tcd/*report.json
            validation/tcd/*.calibration
            validation/tcd/all-features.csv
            validation/tcd/zero-shot.csv
            validation/tcd/all-calibrated.csv
