name: validation-tcd-human-mos
on:
  pull_request:
    paths:
      - "validation/tcd_*.py"
      - "python/calibrate*.py"
      - "src/**"
      - "include/**"
      - ".github/workflows/validation-tcd-human-mos.yml"
  workflow_dispatch:

jobs:
  tcd:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dataset tools
        run: python -m pip install --disable-pip-version-check huggingface_hub openpyxl
      - name: Build OpenVQ
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
      - name: Download TCD-VoIP
        run: |
          mkdir -p validation/tcd
          hf download --repo-type dataset urgent-challenge/urgent26_track2_sqa TCD-VOIP.zip \
            --local-dir validation/tcd
          unzip -q validation/tcd/TCD-VOIP.zip -d validation/tcd/extracted
      - name: Prepare leakage-resistant condition split
        run: |
          python validation/tcd_prepare.py validation/tcd/extracted validation/tcd/manifests
      - name: Zero-shot frozen benchmark
        run: |
          python validation/tcd_score.py validation/tcd/manifests/all.csv validation/tcd/zero-shot.csv
          python validation/tcd_report.py validation/tcd/zero-shot.csv \
            --out validation/tcd/zero-shot-report.json
      - name: Fit base MOS calibration on train only
        run: |
          python python/build_training_table.py \
            validation/tcd/manifests/train.csv validation/tcd/train-base-features.csv
          python python/calibrate.py validation/tcd/train-base-features.csv \
            --out validation/tcd/openvq-base.calibration
      - name: Fit advanced fusion on train only
        run: |
          python python/build_training_table.py \
            validation/tcd/manifests/train.csv validation/tcd/train-advanced-features.csv \
            --calibration validation/tcd/openvq-base.calibration
          python python/calibrate_advanced.py validation/tcd/train-advanced-features.csv \
            --base-calibration validation/tcd/openvq-base.calibration \
            --out validation/tcd/openvq-tcd.calibration
      - name: Evaluate locked TCD test split
        run: |
          python validation/tcd_score.py \
            validation/tcd/manifests/test.csv validation/tcd/test-calibrated.csv \
            --calibration validation/tcd/openvq-tcd.calibration
          python validation/tcd_report.py validation/tcd/test-calibrated.csv \
            --out validation/tcd/test-calibrated-report.json
      - name: Evaluate untouched development split for diagnostics
        run: |
          python validation/tcd_score.py \
            validation/tcd/manifests/dev.csv validation/tcd/dev-calibrated.csv \
            --calibration validation/tcd/openvq-tcd.calibration
          python validation/tcd_report.py validation/tcd/dev-calibrated.csv \
            --out validation/tcd/dev-calibrated-report.json
      - name: Upload TCD validation
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openvq-tcd-validation
          path: |
            validation/tcd/manifests/*.json
            validation/tcd/manifests/*.csv
            validation/tcd/*report.json
            validation/tcd/*.calibration
            validation/tcd/*calibrated.csv
            validation/tcd/zero-shot.csv
