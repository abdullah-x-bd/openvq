name: validation-phase62d-training-contract

on:
  workflow_dispatch:
  push:
    branches: ["validation/phase6"]
    paths:
      - "validation/phase62_contract_diagnostics.py"
      - "validation/phase62_train_normalized_hybrid.py"
      - "validation/phase62_train_normalized_hybrid_seed.py"
      - ".github/workflows/validation-phase62d-training-contract.yml"

permissions:
  actions: read
  contents: read

env:
  TRACE_RUN_ID: "36306154897"
  TRACE_ARTIFACT: "openvq-phase62-trace-v2"

jobs:
  contract_diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install fixed diagnostic runtime
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 torch==2.8.0
      - uses: actions/download-artifact@v5
        with:
          name: ${{ env.TRACE_ARTIFACT }}
          run-id: ${{ env.TRACE_RUN_ID }}
          github-token: ${{ github.token }}
          path: validation/phase6
      - name: Measure padding context and global feature scales
        run: |
          python validation/phase62_contract_diagnostics.py             validation/phase6/sequence-cache-v2/sequences.csv             --out validation/phase6/phase62d-contract-diagnostics.json
      - uses: actions/upload-artifact@v4
        with:
          name: openvq-phase62d-contract-diagnostics
          path: validation/phase6/phase62d-contract-diagnostics.json

  hybrid_normalized_seed:
    needs: contract_diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        held: [nisqa_p501, nisqa_test_for, openace, tcd, tmhint]
        seed: [20260926, 20260927, 20260928]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install fixed training runtime
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 torch==2.8.0
      - uses: actions/download-artifact@v5
        with:
          name: ${{ env.TRACE_ARTIFACT }}
          run-id: ${{ env.TRACE_RUN_ID }}
          github-token: ${{ github.token }}
          path: validation/phase6
      - name: Run normalized hybrid seed
        run: |
          mkdir -p validation/phase6/phase62d-seeds
          python validation/phase62_train_normalized_hybrid_seed.py             validation/phase6/sequence-cache-v2/sequences.csv             --held "${{ matrix.held }}" --seed "${{ matrix.seed }}"             --max-epochs 80             --out "validation/phase6/phase62d-seeds/hybrid_global_zscore__${{ matrix.held }}__${{ matrix.seed }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: phase62d-hybrid-zscore-${{ matrix.held }}-${{ matrix.seed }}
          path: validation/phase6/phase62d-seeds/*.json

  aggregate_hybrid_normalized:
    needs: hybrid_normalized_seed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install metric runtime
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 torch==2.8.0
      - uses: actions/download-artifact@v5
        with:
          pattern: phase62d-hybrid-zscore-*
          merge-multiple: true
          path: validation/phase6/phase62d-seeds
      - name: Reconstruct three-seed ensembles
        run: |
          mkdir -p validation/phase6/phase62d-folds
          for held in nisqa_p501 nisqa_test_for openace tcd tmhint; do
            python validation/phase6_aggregate_fold_seeds.py               --seed-report "validation/phase6/phase62d-seeds/hybrid_global_zscore__${held}__20260926.json"               --seed-report "validation/phase6/phase62d-seeds/hybrid_global_zscore__${held}__20260927.json"               --seed-report "validation/phase6/phase62d-seeds/hybrid_global_zscore__${held}__20260928.json"               --out "validation/phase6/phase62d-folds/hybrid_global_zscore__${held}.json"
          done
      - name: Aggregate normalized hybrid objective
        run: |
          args=()
          for f in validation/phase6/phase62d-folds/*.json; do args+=(--report "$f"); done
          python validation/phase6_aggregate_sequence.py "${args[@]}"             --out validation/phase6/phase62d-hybrid-zscore-selection.json
      - uses: actions/upload-artifact@v4
        with:
          name: openvq-phase62d-hybrid-zscore
          path: |
            validation/phase6/phase62d-seeds/
            validation/phase6/phase62d-folds/
            validation/phase6/phase62d-hybrid-zscore-selection.json
