name: polqa-2018-conformance-audit
on:
  push:
    branches:
      - validation/polqa-conformance
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 unzip file
      - name: Download official ITU P.863 2018 components
        run: |
          mkdir -p /tmp/p863-2018
          aria2c -x16 -s16 -k1M --max-tries=20 --retry-wait=2 \
            --file-allocation=none \
            -d /tmp/p863-2018 -o p863-2018.zip \
            'https://www.itu.int/rec/dologin.asp?id=T-REC-P.863-201803-I%21%21ZIP-E&lang=e&type=items'
          sha256sum /tmp/p863-2018/p863-2018.zip
          unzip -q /tmp/p863-2018/p863-2018.zip -d /tmp/p863-2018/extracted
      - name: Audit conformance tree
        run: |
          mkdir -p validation/polqa-conformance-audit
          {
            echo '# Full tree'
            find /tmp/p863-2018/extracted -type f | sed 's#/tmp/p863-2018/extracted/##' | sort
            echo
            echo '# BAT/CMD files'
            for f in $(find /tmp/p863-2018/extracted -type f \( -iname '*.bat' -o -iname '*.cmd' \)); do
              echo "===== $f ====="
              sed -n '1,220p' "$f"
            done
            echo
            echo '# Result-like text files'
            for f in $(find /tmp/p863-2018/extracted -type f \( -iname '*.txt' -o -iname '*.csv' -o -iname '*.dat' -o -iname '*.out' \) | head -100); do
              echo "===== $f ====="
              sed -n '1,100p' "$f" 2>/dev/null || true
            done
          } > validation/polqa-conformance-audit/audit.txt
          wc -l validation/polqa-conformance-audit/audit.txt
          sed -n '1,2000p' validation/polqa-conformance-audit/audit.txt
      - name: Machine-readable inventory
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,collections
          root=Path('/tmp/p863-2018/extracted')
          files=[p for p in root.rglob('*') if p.is_file()]
          ext=collections.Counter(p.suffix.lower() for p in files)
          out={'count':len(files),'extensions':dict(ext),'files':[str(p.relative_to(root)) for p in files]}
          Path('validation/polqa-conformance-audit/inventory.json').write_text(json.dumps(out,indent=2))
          print(json.dumps({'count':len(files),'extensions':dict(ext)},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polqa-2018-conformance-audit
          path: validation/polqa-conformance-audit/
