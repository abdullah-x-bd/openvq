name: public-polqa-human-benchmark
on:
  push:
    branches: [validation/public-polqa-human-benchmark]
    paths:
      - 'validation/openace_*.py'
      - 'validation/OPENACE_PROTOCOL.md'
      - '.github/workflows/validation-openace.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  score:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl libsndfile1-dev libarmadillo-dev
          curl -L -o /tmp/bazel https://github.com/bazelbuild/bazel/releases/download/5.1.0/bazel-5.1.0-linux-x86_64
          sudo install -m 0755 /tmp/bazel /usr/local/bin/bazel
          python -m pip install --disable-pip-version-check numpy scipy soundfile huggingface_hub openpyxl remotezip requests
      - name: Build OpenVQ
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Build Google ViSQOL v3.3.3
        run: |
          git clone --depth 1 --branch v3.3.3 https://github.com/google/visqol.git /tmp/visqol
          mkdir -p /tmp/armadillo_repo/include
          cp -a /usr/include/armadillo /tmp/armadillo_repo/include/
          cp -a /usr/include/armadillo_bits /tmp/armadillo_repo/include/
          touch /tmp/armadillo_repo/WORKSPACE
          cat > /tmp/armadillo_repo/BUILD <<'EOF'
          cc_library(
              name = "armadillo_header",
              hdrs = glob(["include/armadillo", "include/armadillo_bits/*.hpp"]),
              includes = ["include/"],
              visibility = ["//visibility:public"],
          )
          EOF
          cd /tmp/visqol
          python - <<'PY'
          from pathlib import Path
          p=Path("WORKSPACE")
          s=p.read_text()
          a=s.index("# Armadillo Headers")
          b=s.index("# PFFFT",a)
          replacement='''# Armadillo Headers - patched to system headers for reproducible historical build
          local_repository(
              name = "armadillo_headers",
              path = "/tmp/armadillo_repo",
          )

          '''
          p.write_text(s[:a]+replacement+s[b:])
          PY
          LC_ALL=C bazel build :visqol -c opt \
            --cxxopt=-include --cxxopt=cstdint \
            --cxxopt=-DFLATBUFFERS_LOCALE_INDEPENDENT=0
      - name: Download pinned codec cohort
        run: python validation/openace_prepare.py validation/openace --shard ${{ matrix.shard }} --shards 3
      - name: Compute pinned ViSQOL experts
        run: |
          python validation/visqol_batch.py validation/openace/shard-${{ matrix.shard }}-manifest.csv validation/openace/shard-${{ matrix.shard }}-visqol.csv --binary /tmp/visqol/bazel-bin/visqol
      - name: Compute frozen native OpenVQ and signal features
        run: |
          python validation/openace_score.py validation/openace/shard-${{ matrix.shard }}-visqol.csv validation/openace/shard-${{ matrix.shard }}-scored.csv
      - uses: actions/upload-artifact@v4
        with:
          name: openace-shard-${{ matrix.shard }}
          path: |
            validation/openace/shard-${{ matrix.shard }}-scored.csv
            validation/openace/shard-${{ matrix.shard }}-provenance.json
  report:
    needs: score
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy
      - uses: actions/download-artifact@v5
        with:
          pattern: openace-shard-*
          path: shards
          merge-multiple: true
      - name: Paired human rating comparison and nested development experiment
        run: python validation/openace_report.py shards/*-scored.csv --outdir validation/openace-results
      - uses: actions/upload-artifact@v4
        with:
          name: openvq-openace-polqa-human-results
          path: |
            validation/openace-results/
            shards/*-provenance.json
