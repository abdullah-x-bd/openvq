name: ci
on:
  push:
  pull_request:
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Python syntax
        run: python3 -m py_compile python/calibrate.py python/calibrate_advanced.py python/benchmark.py python/build_training_table.py tools/generate_degradations.py tools/visqol_score.py

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android native toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Build Android AAR
        run: gradle -p android :openvq-android:assembleDebug --no-daemon --stacktrace
