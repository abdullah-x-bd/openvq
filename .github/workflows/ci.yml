name: ci
on:
  push:
  pull_request:
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Python syntax
        run: python3 -m py_compile python/calibrate.py python/benchmark.py tools/generate_degradations.py tools/visqol_score.py
