name: validation-nisqa-probe
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  pull_request:
    paths:
      - ".github/workflows/validation-nisqa-probe.yml"
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install remote ZIP reader
        run: python -m pip install --disable-pip-version-check remotezip requests
      - name: Extract only NISQA TEST P501 from canonical Zenodo archive
        run: |
          python - <<'PY'
          from remotezip import RemoteZip
          from pathlib import Path
          url="https://zenodo.org/records/4728081/files/NISQA_Corpus.zip?download=1"
          out=Path("validation/nisqa_probe")
          out.mkdir(parents=True,exist_ok=True)
          with RemoteZip(url) as z:
              names=z.namelist()
              matches=[n for n in names if "NISQA_TEST_P501/" in n and not n.endswith("/")]
              (out/"zip-matches.txt").write_text("\n".join(matches),encoding="utf-8")
              print("matches",len(matches))
              for name in matches:
                  z.extract(name,path=out)
          PY
      - name: Inventory
        run: |
          find validation/nisqa_probe -maxdepth 8 -type f | sort | tee validation/nisqa_probe/inventory.txt
          du -sh validation/nisqa_probe | tee validation/nisqa_probe/size.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nisqa-p501-probe
          path: |
            validation/nisqa_probe/inventory.txt
            validation/nisqa_probe/size.txt
            validation/nisqa_probe/zip-matches.txt
