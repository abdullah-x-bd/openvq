name: validation-nisqa-p501-probe
on:
  pull_request:
    paths:
      - "validation/nisqa_remote_probe.py"
      - ".github/workflows/validation-nisqa-p501-probe.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check remotezip requests
      - name: Probe NISQA archive without full download
        run: |
          mkdir -p validation/nisqa
          python validation/nisqa_remote_probe.py \
            --out validation/nisqa/p501-probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: nisqa-p501-probe
          path: validation/nisqa/p501-probe.json
