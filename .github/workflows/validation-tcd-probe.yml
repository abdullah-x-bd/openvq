name: validation-tcd-probe
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  pull_request:
    paths:
      - "validation/tcd_probe.py"
      - ".github/workflows/validation-tcd-probe.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dataset tools
        run: python -m pip install --disable-pip-version-check huggingface_hub openpyxl
      - name: Download TCD-VoIP
        run: |
          mkdir -p validation/tcd
          hf download --repo-type dataset urgent-challenge/urgent26_track2_sqa TCD-VOIP.zip \
            --local-dir validation/tcd
          unzip -q validation/tcd/TCD-VOIP.zip -d validation/tcd/extracted
      - name: Probe dataset structure
        run: |
          python validation/tcd_probe.py validation/tcd/extracted \
            | tee validation/tcd/probe.json
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: tcd-voip-probe
          path: validation/tcd/probe.json
