name: validation-phase62-corrected-trace-baseline

on:
  workflow_dispatch:
  push:
    branches: ["validation/phase6"]
    paths:
      - "src/trace.cpp"
      - "src/trace_spectral.cpp"
      - "src/trace_spectral.h"
      - "include/openvq/trace.h"
      - "tests/test_trace_spectral.cpp"
      - "CMakeLists.txt"
      - "validation/phase6_export_sequences.py"
      - "validation/phase6_train_sequence.py"
      - "validation/phase6_train_sequence_seed.py"
      - "validation/phase6_aggregate_fold_seeds.py"
      - "validation/phase6_aggregate_sequence.py"
      - ".github/workflows/validation-phase62-trace-baseline.yml"

permissions:
  actions: read
  contents: read

env:
  PHASE6B_RUN_ID: "36233995161"
  PHASE6B_ARTIFACT: "openvq-phase6b-summary"

jobs:
  trace_v2:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify frozen Phase 6A source contract
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          freeze=json.loads(Path("validation/phase6/frontend-freeze.json").read_text())
          for p,expected in freeze["files"].items():
              got=hashlib.sha256(Path(p).read_bytes()).hexdigest()
              if got!=expected:
                  raise SystemExit(f"frozen frontend drift: {p} {got} != {expected}")
          print("verified",freeze["frontend_id"],freeze["source_commit"])
          PY

      - name: Install data dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            numpy soundfile huggingface_hub openpyxl remotezip pyyaml

      - name: Build and prove Trace V2 mathematics
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          ctest --test-dir build -R openvq_trace_spectral_tests --output-on-failure
          test -x ./build/openvq_trace_cli

      - name: Download canonical Phase 6B evidence
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.PHASE6B_ARTIFACT }}
          run-id: ${{ env.PHASE6B_RUN_ID }}
          github-token: ${{ github.token }}
          path: validation/phase6/baseline

      - name: Recreate TCD audio
        run: |
          mkdir -p validation/phase6/data/tcd
          hf download --repo-type dataset urgent-challenge/urgent26_track2_sqa \
            TCD-VOIP.zip --local-dir validation/phase6/data/tcd
          unzip -q validation/phase6/data/tcd/TCD-VOIP.zip -d validation/phase6/data/tcd/extracted
          python validation/tcd_prepare.py \
            validation/phase6/data/tcd/extracted validation/phase6/data/tcd/manifests

      - name: Recreate NISQA P501 and TEST_FOR audio
        run: |
          set -e
          success=0
          for attempt in 1 2 3 4 5; do
            echo "NISQA remote extraction attempt $attempt/5"
            rm -rf validation/phase6/data/p501 validation/phase6/data/test-for
            mkdir -p validation/phase6/data/p501 validation/phase6/data/test-for
            if python - <<'PY'
          from remotezip import RemoteZip
          from pathlib import Path
          url="https://zenodo.org/records/4728081/files/NISQA_Corpus.zip?download=1"
          roots={"NISQA_TEST_P501/":Path("validation/phase6/data/p501"),
                 "NISQA_TEST_FOR/":Path("validation/phase6/data/test-for")}
          with RemoteZip(url) as z:
              names=z.namelist()
              for token,out in roots.items():
                  mm=[n for n in names if token in n and not n.endswith("/")]
                  if not mm:raise SystemExit("missing "+token)
                  for n in mm:z.extract(n,path=out)
          PY
            then
              success=1
              break
            fi
            sleep $((attempt * 20))
          done
          test "$success" -eq 1
          python validation/nisqa_holdout_prepare.py validation/phase6/data/p501 \
            validation/phase6/data/p501.csv --family NISQA_TEST_P501 --expected 240
          python validation/nisqa_holdout_prepare.py validation/phase6/data/test-for \
            validation/phase6/data/test-for.csv --family NISQA_TEST_FOR --expected 240

      - name: Recreate OpenACE audio
        run: |
          mkdir -p validation/phase6/data/openace
          REVISION="$(cat validation/phase6/baseline/data/openace/revision.txt)"
          hf download --repo-type dataset mcernak/EARS-EMO-OpenACE \
            --revision "$REVISION" --local-dir validation/phase6/data/openace/raw
          python validation/openace_prepare.py \
            validation/phase6/data/openace/raw validation/phase6/data/openace-raw.csv
          python validation/manifest_pcm16.py \
            validation/phase6/data/openace-raw.csv validation/phase6/data/openace.csv \
            validation/phase6/data/openace-pcm16

      - name: Recreate pinned TMHINT audio
        run: |
          mkdir -p validation/phase6/data/tmhint
          hf download --repo-type dataset urgent-challenge/urgent26_track2_sqa \
            TMHINTQI.zip --local-dir validation/phase6/data/tmhint
          unzip -q validation/phase6/data/tmhint/TMHINTQI.zip -d validation/phase6/data/tmhint/extracted
          python validation/phase6_tmhint_prepare.py \
            validation/phase6/data/tmhint/extracted validation/phase6/data/tmhint.csv \
            --archive validation/phase6/data/tmhint/TMHINTQI.zip \
            --exclusions validation/phase6/data/tmhint-exclusions.csv

      - name: Verify every recreated waveform against Phase 6B
        run: |
          python validation/phase6_verify_audio_registry.py \
            validation/phase6/baseline/canonical-manifest.csv

      - name: Combine frozen rich-v3 feature evidence
        run: |
          python validation/phase6_combine_features.py \
            --input validation/phase6/baseline/tcd-features-source.csv \
            --input validation/phase6/baseline/p501-features-source.csv \
            --input validation/phase6/baseline/test-for-features-source.csv \
            --input validation/phase6/baseline/openace-features-source.csv \
            --input validation/phase6/baseline/tmhint-features-source.csv \
            --output validation/phase6/baseline/all-features-source.csv

      - name: Export all corrected Trace V2 development timelines
        run: |
          python validation/phase6_export_sequences.py \
            validation/phase6/baseline/canonical-manifest.csv \
            validation/phase6/baseline/all-features-source.csv \
            validation/phase6/sequence-cache-v2 \
            --trace-cli ./build/openvq_trace_cli --jobs 2

      - name: Build corrected Trace V2 engineering timelines
        run: |
          python validation/phase6_engineering_pairs.py \
            validation/phase6/model-engineering-v2/audio \
            validation/phase6/model-engineering-v2/manifest.csv
          python validation/phase6_extract_features.py \
            validation/phase6/model-engineering-v2/manifest.csv \
            validation/phase6/model-engineering-v2/features.csv \
            --dataset engineering --target-field human_mos --target-scale mos1to5 \
            --group-field group_id --system-field condition_id --cli ./build/openvq_cli
          python validation/phase6_export_sequences.py \
            validation/phase6/model-engineering-v2/manifest.csv \
            validation/phase6/model-engineering-v2/features.csv \
            validation/phase6/model-engineering-v2/cache \
            --trace-cli ./build/openvq_trace_cli --jobs 2

      - name: Freeze corrected trace provenance
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          def sha(p):return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          dev=Path("validation/phase6/sequence-cache-v2/trace-provenance.json")
          eng=Path("validation/phase6/model-engineering-v2/cache/trace-provenance.json")
          d=json.loads(dev.read_text())
          e=json.loads(eng.read_text())
          expected_schema="openvq-trace-v2-2026-09-27"
          expected_impl="openvq-trace-spectral-v2-fft-corrected-2026-09-27"
          if d["trace_schema_id"]!=expected_schema or e["trace_schema_id"]!=expected_schema:
              raise SystemExit("trace schema freeze mismatch")
          if d["trace_implementation_id"]!=expected_impl or e["trace_implementation_id"]!=expected_impl:
              raise SystemExit("trace implementation freeze mismatch")
          out={
            "phase":"6.2B",
            "source_commit":os.environ["GITHUB_SHA"],
            "frontend_id":d["frontend_id"],
            "trace_schema_id":expected_schema,
            "trace_implementation_id":expected_impl,
            "development_rows":d["rows"],
            "development_trace_provenance_sha256":sha(dev),
            "engineering_trace_provenance_sha256":sha(eng),
            "phase6b_run":36233995161,
            "phase6b_artifact":10905043210,
            "phase6b_artifact_sha256":"8d5fefb87379862acf6385d0514d1ac0088c87762612a3c05601ff978a24d32b"
          }
          Path("validation/phase6/phase62-trace-v2-freeze.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: openvq-phase62-trace-v2
          compression-level: 1
          path: |
            validation/phase6/sequence-cache-v2/
            validation/phase6/model-engineering-v2/cache/
            validation/phase6/model-engineering-v2/manifest.csv
            validation/phase6/phase62-trace-v2-freeze.json
            validation/phase6/baseline/canonical-manifest.csv
            validation/phase6/baseline/splits.json

  corrected_loco_seed:
    needs: trace_v2
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        mode: [native_temporal, learned_bands, hybrid]
        held: [nisqa_p501, nisqa_test_for, openace, tcd, tmhint]
        seed: [20260926, 20260927, 20260928]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install fixed training runtime
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.1.3 torch==2.8.0
      - uses: actions/download-artifact@v5
        with:
          name: openvq-phase62-trace-v2
          path: validation/phase6
      - name: Run one frozen Phase 6E seed on corrected Trace V2
        run: |
          mkdir -p validation/phase6/phase62-seeds
          python validation/phase6_train_sequence_seed.py \
            validation/phase6/sequence-cache-v2/sequences.csv \
            --mode "${{ matrix.mode }}" --held "${{ matrix.held }}" \
            --seed "${{ matrix.seed }}" --max-epochs 80 \
            --out "validation/phase6/phase62-seeds/${{ matrix.mode }}__${{ matrix.held }}__${{ matrix.seed }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: phase62-seed-${{ matrix.mode }}-${{ matrix.held }}-${{ matrix.seed }}
          path: validation/phase6/phase62-seeds/*.json

  aggregate_corrected_baseline:
    needs: corrected_loco_seed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install metric runtime
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 torch==2.8.0
      - uses: actions/download-artifact@v5
        with:
          pattern: phase62-seed-*
          merge-multiple: true
          path: validation/phase6/phase62-seeds
      - name: Reconstruct the original three-seed fold ensembles
        run: |
          mkdir -p validation/phase6/phase62-folds
          for mode in native_temporal learned_bands hybrid; do
            for held in nisqa_p501 nisqa_test_for openace tcd tmhint; do
              python validation/phase6_aggregate_fold_seeds.py \
                --seed-report "validation/phase6/phase62-seeds/${mode}__${held}__20260926.json" \
                --seed-report "validation/phase6/phase62-seeds/${mode}__${held}__20260927.json" \
                --seed-report "validation/phase6/phase62-seeds/${mode}__${held}__20260928.json" \
                --out "validation/phase6/phase62-folds/${mode}__${held}.json"
            done
          done
          test "$(find validation/phase6/phase62-folds -name '*.json' | wc -l)" -eq 15
      - name: Apply unchanged Phase 6E architecture selection rule
        run: |
          args=()
          for f in validation/phase6/phase62-folds/*.json; do args+=(--report "$f"); done
          python validation/phase6_aggregate_sequence.py "${args[@]}" \
            --out validation/phase6/phase62-corrected-trace-selection.json
      - uses: actions/upload-artifact@v4
        with:
          name: openvq-phase62-corrected-trace-baseline
          path: |
            validation/phase6/phase62-seeds/
            validation/phase6/phase62-folds/
            validation/phase6/phase62-corrected-trace-selection.json
