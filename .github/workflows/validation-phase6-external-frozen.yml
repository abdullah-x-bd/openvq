name: validation-phase6-external-frozen

on:
  workflow_dispatch:
    inputs:
      frozen_commit:
        description: "Exact frozen Phase 6 source commit"
        required: true
        type: string
      candidate_run_id:
        description: "Actions run containing openvq-phase6-candidate"
        required: true
        type: string
      bundle_sha256:
        description: "SHA-256 of bundle.json"
        required: true
        type: string
      reference_map_run_id:
        description: "Actions run containing verified URGENT clean-reference map artifact"
        required: true
        type: string
      reference_map_artifact:
        description: "Reference-map artifact name"
        required: true
        type: string
      reference_map_sha256:
        description: "SHA-256 of reference-map CSV"
        required: true
        type: string
      confirm:
        description: "Type FREEZE_AND_SCORE_URGENT_ONCE"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  frozen_external:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require explicit one-shot confirmation
        run: |
          test "${{ inputs.confirm }}" = "FREEZE_AND_SCORE_URGENT_ONCE"
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.frozen_commit }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install frozen evaluation dependencies
        run: |
          python -m pip install --disable-pip-version-check             numpy==2.3.3 soundfile datasets huggingface_hub onnxruntime==1.30.0
      - name: Verify and download frozen model bundle
        run: |
          mkdir -p validation/phase6/external/candidate
          gh run download "${{ inputs.candidate_run_id }}" --repo abdullah-x-bd/openvq             --name openvq-phase6-candidate --dir validation/phase6/external/candidate
          bundle="$(find validation/phase6/external/candidate -name bundle.json | head -1)"
          test -n "$bundle"
          echo "${{ inputs.bundle_sha256 }}  $bundle" | sha256sum -c -
          cp "$bundle" validation/phase6/external/bundle.json
          onnx="$(find validation/phase6/external/candidate -name model.onnx | head -1)"
          cp "$onnx" validation/phase6/external/model.onnx
      - name: Download verified clean-reference map
        run: |
          mkdir -p validation/phase6/external/refmap
          gh run download "${{ inputs.reference_map_run_id }}" --repo abdullah-x-bd/openvq             --name "${{ inputs.reference_map_artifact }}" --dir validation/phase6/external/refmap
          map="$(find validation/phase6/external/refmap -name '*.csv' | head -1)"
          test -n "$map"
          echo "${{ inputs.reference_map_sha256 }}  $map" | sha256sum -c -
          cp "$map" validation/phase6/external/reference-map.csv
      - name: Build exact frozen frontend
        run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.frozen_commit }}"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Open reserved URGENT labels and prepare only verified full-reference rows
        run: |
          python validation/phase6_prepare_urgent.py             --reference-map validation/phase6/external/reference-map.csv             --expected-map-sha256 "${{ inputs.reference_map_sha256 }}"             --outdir validation/phase6/external/urgent             --output validation/phase6/external/urgent-manifest.csv
      - name: Extract frozen Phase 6 features and traces
        run: |
          python validation/phase6_extract_features.py             validation/phase6/external/urgent-manifest.csv validation/phase6/external/urgent-features.csv             --dataset urgent2026 --target-field human_mos --target-scale mos1to5             --group-field group_id --system-field system_id --speaker-field speaker_id --cli ./build/openvq_cli
          python validation/phase6_export_sequences.py             validation/phase6/external/urgent-manifest.csv validation/phase6/external/urgent-features.csv             validation/phase6/external/sequences --trace-cli ./build/openvq_trace_cli --jobs 4
      - name: Score frozen Phase 6 candidate
        run: |
          python validation/phase6_score_onnx.py validation/phase6/external/sequences/sequences.csv             --onnx validation/phase6/external/model.onnx             --out validation/phase6/external/urgent-scored.csv
          python validation/phase6_external_report.py validation/phase6/external/urgent-scored.csv             --out validation/phase6/external/urgent-report.json --bootstrap 10000 --seed 20260926
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openvq-phase6-frozen-external
          path: |
            validation/phase6/external/bundle.json
            validation/phase6/external/reference-map.csv
            validation/phase6/external/urgent-manifest.csv
            validation/phase6/external/urgent-scored.csv
            validation/phase6/external/urgent-report.json
            validation/phase6/external/urgent/exclusions.csv
