name: validation-engineering
on:
  pull_request:
    paths:
      - "src/**"
      - "include/**"
      - "validation/**"
      - ".github/workflows/validation-engineering.yml"
  workflow_dispatch:

jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build OpenVQ
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
      - name: Native regression tests
        run: ctest --test-dir build --output-on-failure
      - name: Engineering validation matrix
        run: |
          mkdir -p validation/out
          python3 validation/engineering_matrix.py \
            --cli ./build/openvq_cli \
            --fuzz 160 \
            --out validation/out/engineering-results.json
      - name: Upload validation result
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openvq-engineering-validation
          path: validation/out/engineering-results.json
