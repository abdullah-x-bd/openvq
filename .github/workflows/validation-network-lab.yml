name: validation-network-lab
on:
  pull_request:
    paths:
      - "validation/rtp_netem_lab.py"
      - "src/**"
      - "include/**"
      - ".github/workflows/validation-network-lab.yml"
  workflow_dispatch:
jobs:
  netem:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install netem
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iproute2
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
      - name: Run real UDP/netem laboratory
        run: |
          mkdir -p validation/out
          python3 validation/rtp_netem_lab.py \
            --cli ./build/openvq_cli \
            --out validation/out/rtp-netem-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openvq-rtp-netem-validation
          path: validation/out/rtp-netem-results.json
